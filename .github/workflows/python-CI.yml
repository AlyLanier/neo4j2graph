name: Python CI

on:
  workflow_dispatch:
  pull_request: 
  push:
    branches: [ main ]

env:  
  NEO4J_USER: neo4j
  NEO4J_PASSWORD: password
  NEO4J_CONTAINER_NAME: test

jobs:
  download_neo4j_jar:
    runs-on: ubuntu-latest
    steps:
      - name: Get run ID of "build" workflow
        id: get-run-id
        run: |
          OTHER_REPO="AlyLanier/neo4j-UserDefinedFunctions-Mean"
          WF_NAME="build"
          RUN_ID=`gh run --repo ${OTHER_REPO} list --workflow ${WF_NAME} --json databaseId --jq .[0].databaseId`
          echo "Detected latest run id of ${RUN_ID} for workflow ${WF_NAME}"
          echo "run-id=${RUN_ID}" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Download artifact from "build" workflow
        uses: actions/download-artifact@v4
        with:
          name: test_jar.jar # Match name used in test.yml upload artifact step
          github-token: ${{ github.token }}
          repository: AlyLanier/neo4j-UserDefinedFunctions-Mean
          run-id: ${{ steps.get-run-id.outputs.run-id }}

      - name: Show downloaded files
        run: ls -la

  tests:
    runs-on: ubuntu-latest

    services:
      neo4j:
        image: neo4j:latest
        options: >- 
          --name test
          --health-cmd "cypher-shell -u neo4j -p password 'RETURN 1;' || exit 1"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 10
        ports:                    
          - 7474:7474 # used for http
          - 7687:7687 # used for bolt
        env:       
          NEO4J_AUTH: ${{ env.NEO4J_USER }}/${{ env.NEO4J_PASSWORD }} 
          NEO4J_apoc_export_file_enabled: "true"
          NEO4J_apoc_import_file_enabled: "true"
          NEO4J_apoc_import_file_use__neo4j__config: "true"
          NEO4J_PLUGINS: '["apoc", "apoc-extended"]'

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'
          
      - name: Install Dependencies
        run: pip install -e ".[dev]"

      - name: run tests
        run: python -m unittest discover -s tests -v
